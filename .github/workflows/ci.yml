name: FinVault Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Typecheck & 196-Test Verification Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Turborepo Typecheck
        run: pnpm turbo typecheck

      - name: Turborepo Workspace Tests
        run: pnpm turbo test

      - name: Master 5-Tier 196-Test Verification Suite
        run: |
          node --experimental-strip-types tests/e2e/runner.ts
          node --test tests/mobile/mobile.test.ts tests/mobile/biometric-bypass.test.ts
          node --experimental-strip-types tests/e2e/tier5-backend-adversarial.ts
          node --experimental-strip-types tests/e2e/tier5-frontend-adversarial.ts
          node --test tests/mobile/adversarial-stress.test.ts
          node --test tests/mobile/adversarial.stress.ts
          node --test packages/sync-engine/tests/sync-engine.test.ts

  web-e2e:
    name: Web Playwright Regression Gate
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Libraries
        run: pnpm turbo build --filter=@finvault/ui --filter=@finvault/sync-engine --filter=@finvault/db-types

      - name: Install Playwright Chromium
        run: pnpm --filter @finvault/web exec playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: pnpm --filter @finvault/web test:e2e
