appId: com.finvault.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "mobile-google-login-btn"
    timeout: 15000
- assertNotVisible:
    text: ".*has stopped.*"
- assertNotVisible:
    text: ".*isn't responding.*"
- tapOn:
    id: "mobile-email-input"
- inputText: "${E2E_TEST_EMAIL}"
- hideKeyboard
- tapOn:
    id: "mobile-password-input"
- inputText: "${E2E_TEST_PASSWORD}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "mobile-email-login-btn"
    direction: DOWN
- tapOn:
    id: "mobile-email-login-btn"
- extendedWaitUntil:
    visible:
      id: "net-worth-heading"
    timeout: 20000
- assertVisible:
    id: "sync-status-badge"
- assertVisible:
    id: "account-menu-btn"
- assertVisible:
    id: "net-worth-assets-heading"
- tapOn:
    id: "account-menu-btn"
- assertVisible:
    id: "account-email-text"
- assertVisible:
    id: "sync-now-btn"
- assertVisible:
    id: "sign-out-btn"
- tapOn:
    id: "account-modal-close-btn"
- tapOn:
    id: "tab-cash-flow"
- assertVisible:
    id: "cash-flow-heading"
- assertVisible:
    id: "cash-flow-inflows-heading"
- tapOn:
    id: "tab-transaction-entry"
- assertVisible:
    id: "transaction-entry-heading"
- tapOn:
    id: "tab-iou-tracker"
- assertVisible:
    id: "iou-tracker-heading"
- tapOn:
    id: "tab-net-worth"
- assertVisible:
    id: "net-worth-heading"
